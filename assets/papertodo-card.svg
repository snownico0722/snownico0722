<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300">
  <defs>
    <linearGradient id="cardBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f6f1e7"/>
      <stop offset="1" stop-color="#eee5d5"/>
    </linearGradient>
    <filter id="paperShadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#000000" flood-opacity="0.22"/>
    </filter>
  </defs>
  <rect width="1200" height="300" rx="24" fill="#0f1115"/>
  <g filter="url(#paperShadow)">
    <rect x="58" y="42" width="1084" height="216" rx="24" fill="url(#cardBg)"/>
  </g>
  <text x="100" y="105" fill="#1e2228" font-family="Segoe UI, Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="42" font-weight="700">PaperTodo</text>
  <text x="100" y="148" fill="#444951" font-family="Segoe UI, Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="22" font-weight="600">一张真正住在桌面上的纸</text>
  <text x="100" y="188" fill="#686e76" font-family="Segoe UI, Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="17">轻量 · 原生 · 低干扰 · 交互优先</text>
  <text x="100" y="220" fill="#7b8188" font-family="Segoe UI, Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="16">让工具在需要时出现，在不需要时安静。</text>
  <g transform="translate(850 70)">
    <rect width="236" height="160" rx="18" fill="#fbf8f1" stroke="#d6cbb8"/>
    <rect x="22" y="24" width="142" height="12" rx="6" fill="#23272c" opacity="0.88"/>
    <rect x="22" y="56" width="178" height="8" rx="4" fill="#7c746a" opacity="0.35"/>
    <rect x="22" y="78" width="156" height="8" rx="4" fill="#7c746a" opacity="0.28"/>
    <rect x="22" y="100" width="132" height="8" rx="4" fill="#7c746a" opacity="0.22"/>
    <rect x="22" y="126" width="84" height="10" rx="5" fill="#23272c" opacity="0.72"/>
  </g>
</svg>
